<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrape Filters - QMediaSync</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #0f172a;
        --panel-2: #111b34;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22d3ee;
        --ok: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
        --border: #1f2a44;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 800px at 10% 10%, #1e293b, var(--bg));
      }
      .shell { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }
      header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
      h1 { margin:0; font-size: 26px; }
      .hint { font-size: 13px; color: var(--muted); }
      .status {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.7);
        color: var(--muted);
        margin-bottom: 16px;
      }
      .panel {
        background: linear-gradient(160deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 12px 30px rgba(0,0,0,.25);
        margin-bottom: 16px;
      }
      .panel h2 { margin:0 0 10px; font-size:16px; color: var(--accent); }
      label { font-size: 12px; color: var(--muted); display:block; margin-bottom:6px; }
      input, textarea, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0b1226;
        color: var(--text);
        outline: none;
        font-family: inherit;
      }
      textarea { min-height: 80px; resize: vertical; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      button {
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #02131d;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #0b1226;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .row { grid-template-columns: 1fr; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Scrape Filters</h1>
        <div class="hint">Append <code>?api_key=YOUR_KEY</code> if not logged in</div>
      </header>

      <div id="status" class="status">Loading...</div>

      <section class="panel">
        <h2>Scrape Path</h2>
        <label for="pathSelect">Select Path</label>
        <select id="pathSelect"></select>
        <div class="meta" id="pathMeta"></div>
      </section>

      <section class="panel">
        <h2>Exclude Keywords</h2>
        <div class="row">
          <div>
            <label for="dirKeywords">Exclude Directories (comma/newline)</label>
            <textarea id="dirKeywords" placeholder="extras, sample"></textarea>
          </div>
          <div>
            <label for="fileKeywords">Exclude Files (comma/newline)</label>
            <textarea id="fileKeywords" placeholder="sample"></textarea>
          </div>
        </div>
        <div style="margin-top:12px;">
          <label for="deleteKeywords">Delete Keywords for Title Parse (comma/newline)</label>
          <textarea id="deleteKeywords" placeholder="Criterion Collection, FLAC 2.0"></textarea>
          <div class="meta" style="margin-top:6px;">
            These keywords are removed before title/year parsing. Keep this list minimal to avoid over-stripping.
          </div>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button id="saveBtn">Save</button>
          <button class="secondary" id="reloadBtn">Reload</button>
        </div>
      </section>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const apiKey = params.get("api_key") || "";
      const statusEl = document.getElementById("status");
      const pathSelect = document.getElementById("pathSelect");
      const pathMeta = document.getElementById("pathMeta");
      const dirKeywords = document.getElementById("dirKeywords");
      const fileKeywords = document.getElementById("fileKeywords");
      const deleteKeywords = document.getElementById("deleteKeywords");
      const saveBtn = document.getElementById("saveBtn");
      const reloadBtn = document.getElementById("reloadBtn");

      function setStatus(text, type) {
        statusEl.textContent = text;
        if (type === "ok") statusEl.style.color = "var(--ok)";
        if (type === "warn") statusEl.style.color = "var(--warn)";
        if (type === "danger") statusEl.style.color = "var(--danger)";
      }

      function withApiKey(url) {
        if (!apiKey) return url;
        return url + (url.includes("?") ? "&" : "?") + "api_key=" + encodeURIComponent(apiKey);
      }

      async function apiGet(url) {
        const res = await fetch(withApiKey(url), { headers: { "Content-Type": "application/json" } });
        const data = await res.json();
        if (data.code !== 200) throw new Error(data.message || "Request failed");
        return data.data;
      }

      async function apiPost(url, body) {
        const res = await fetch(withApiKey(url), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.code !== 200) throw new Error(data.message || "Request failed");
        return data.data;
      }

      function splitKeywords(value) {
        return value
          .split(/[,\n]/)
          .map(s => s.trim())
          .filter(Boolean);
      }

      function joinKeywords(list) {
        return (list || []).join(", ");
      }

      async function loadPaths() {
        const list = await apiGet("/api/scrape/pathes");
        pathSelect.innerHTML = "";
        list.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = `${p.id} - ${p.source_path}`;
          pathSelect.appendChild(opt);
        });
        const initialId = params.get("id") || (list[0] ? list[0].id : "");
        if (initialId) {
          pathSelect.value = initialId;
          await loadPath(initialId);
        }
      }

      async function loadPath(id) {
        if (!id) return;
        const data = await apiGet(`/api/scrape/pathes/${id}`);
        pathMeta.textContent = `Source: ${data.source_path} | Dest: ${data.dest_path}`;
        dirKeywords.value = joinKeywords(data.exclude_dir_keywords);
        fileKeywords.value = joinKeywords(data.exclude_file_keywords);
        deleteKeywords.value = joinKeywords(data.delete_keyword);
        setStatus("Loaded", "ok");
      }

      pathSelect.addEventListener("change", async () => {
        try {
          setStatus("Loading...", "warn");
          await loadPath(pathSelect.value);
        } catch (err) {
          setStatus(err.message || "Load failed", "danger");
        }
      });

      reloadBtn.addEventListener("click", async () => {
        try {
          setStatus("Reloading...", "warn");
          await loadPath(pathSelect.value);
        } catch (err) {
          setStatus(err.message || "Reload failed", "danger");
        }
      });

      saveBtn.addEventListener("click", async () => {
        try {
          setStatus("Saving...", "warn");
          await apiPost("/api/scrape/pathes/filters", {
            id: Number(pathSelect.value),
            exclude_dir_keywords: splitKeywords(dirKeywords.value),
            exclude_file_keywords: splitKeywords(fileKeywords.value),
            delete_keyword: splitKeywords(deleteKeywords.value),
          });
          setStatus("Saved", "ok");
        } catch (err) {
          setStatus(err.message || "Save failed", "danger");
        }
      });

      (async () => {
        try {
          setStatus("Loading...", "warn");
          await loadPaths();
        } catch (err) {
          setStatus(err.message || "Init failed", "danger");
        }
      })();
    </script>
  </body>
</html>
